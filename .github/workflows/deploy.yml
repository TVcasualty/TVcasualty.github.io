name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN needs pages: write and id-token: write for deploy-pages to
# mint its OIDC token; nothing here writes to the repo itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is false on purpose: cancelling
# a half-finished Pages deployment can leave the live site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # styled-system/ is generated and gitignored, so codegen has to run
      # before the typecheck or tsc cannot resolve styled-system/css.
      - name: Panda codegen
        run: bun run panda

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v6

      # v5 rather than v3 specifically for the Node 20 deprecation: this action
      # is a composite wrapper, and it is its own pinned actions/upload-artifact
      # that the runner warning names, not anything written here.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # REQUIRED, not optional tidiness. From v4 this action tars with
          # `--exclude=.[^/]*` unless this is set, which would silently drop
          # dist/.nojekyll — the file that stops Pages running the output
          # through Jekyll. Losing it breaks any path beginning with an
          # underscore and is exactly the kind of failure that ships green.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
